# enkakumon.conf — tunable values, read by the C daemon and the Python UI.
# Format: KEY = value, one per line. Lines starting with # are comments.

# --- Sampling ---
SAMPLE_HZ = 1
RETRY_S = 30                # retry a failed sensor's init this often

# --- I2C ---
I2C_DEV = /dev/i2c-1

# --- SCD40 ---
TEMP_OFFSET_C = 0.0         # subtracted from SCD40 temperature

# --- SGP40 compensation fallback (used until the SCD40 has data) ---
DEFAULT_TEMP_C = 25.0
DEFAULT_RH = 50.0

# --- Microphone ---
MIC_NAME = googlevoicehat   # substring of the ALSA card name
MIC_RATE = 48000
MIC_PERIOD_FRAMES = 4800    # frames per capture read (0.1 s at 48 kHz)
DB_OFFSET = 120.0

# --- IPC and supervision ---
SOCKET_PATH = /tmp/enkakumon.sock
MAX_CLIENTS = 4
HEARTBEAT_PATH = /dev/shm/enkakumon.heartbeat   # tmpfs: touched every second

# --- Display (UI) ---
DC_PIN = 25
RST_PIN = 24
SPI_BAUD = 24000000
