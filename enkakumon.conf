# enkakumon.conf — tunable values, read by the C daemon and the Python UI.
# Format: KEY = value, one per line. Lines starting with # are comments.

# --- Sampling ---
SAMPLE_HZ = 1
RETRY_S = 30                # retry a failed sensor's init this often

# --- I2C ---
I2C_DEV = /dev/i2c-1

# --- SCD40 ---
TEMP_OFFSET_C = 0.0         # subtracted from SCD40 temperature

# --- SGP40 compensation fallback (used until the SCD40 has data) ---
DEFAULT_TEMP_C = 25.0
DEFAULT_RH = 50.0

# --- Microphone ---
MIC_NAME = googlevoicehat   # substring of the ALSA card name
MIC_RATE = 48000
MIC_PERIOD_FRAMES = 4800    # frames per capture read (0.1 s at 48 kHz)
DB_OFFSET = 120.0

# --- IPC and supervision ---
SOCKET_PATH = /tmp/enkakumon.sock
MAX_CLIENTS = 4
HEARTBEAT_PATH = /dev/shm/enkakumon.heartbeat   # tmpfs: touched every second

# --- Display (UI) ---
DC_PIN = 25
RST_PIN = 24
SPI_BAUD = 24000000

# --- Touch (UI). Calibrate with: python src/ui/display.py ---
TOUCH_X_MIN = 200           # raw reading at the left edge (min > max flips the axis)
TOUCH_X_MAX = 3900          # raw reading at the right edge
TOUCH_Y_MIN = 200           # raw reading at the top edge
TOUCH_Y_MAX = 3900          # raw reading at the bottom edge
TOUCH_SWAP_XY = 0           # 1 if moving left-right changes raw y instead of x
TOUCH_PRESSURE_MIN = 100    # raw pressure that counts as a touch
