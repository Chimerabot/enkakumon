# enkakumon.conf — tunable values, read by the C daemon and the Python UI.
# Format: KEY = value, one per line. Lines starting with # are comments.

# --- Sampling (once per second, fixed) ---
RETRY_S = 30                # retry a failed sensor's init this often

# --- I2C ---
I2C_DEV = /dev/i2c-1

# --- SCD40 ---
TEMP_OFFSET_C = 0.0         # subtracted from SCD40 temperature

# --- SGP40 compensation fallback (used until the SCD40 has data) ---
DEFAULT_TEMP_C = 25.0
DEFAULT_RH = 50.0

# --- Microphone ---
MIC_NAME = googlevoicehat   # substring of the ALSA card name
MIC_RATE = 48000
MIC_PERIOD_FRAMES = 4800    # frames per capture read (0.1 s at 48 kHz)
DB_OFFSET = 120.0

# --- IPC and supervision ---
SOCKET_PATH = /tmp/enkakumon.sock
MAX_CLIENTS = 4
HEARTBEAT_PATH = /dev/shm/enkakumon.heartbeat   # tmpfs: touched every second

# --- Health system (src/analysis/pet.c; rules in docs/enkakumon ux.md) ---
PET_PATH = pet.state        # relative to the working directory; saved every PET_SAVE_S and on stop
PET_SAVE_S = 60
# Significant readings: a 5-minute average above any of these costs 1 health
PET_CO2_MAX = 1000          # ppm (also the graph's warn line)
PET_VOC_MAX = 150           # VOC index (also the graph's warn line)
PET_DB_MAX = 70             # dB SPL (also the graph's warn line)
PET_PROXIMITY_MAX = 200     # 0-255; above this the pet is covered
# Sleep: light below this (and not covered) for PET_SLEEP_S seconds
PET_DARK_LIGHT = 10         # raw clear count; calibrate on the Pi
PET_SLEEP_S = 30
# Surprises
PET_COLOR_RATIO = 1.5       # asked channel vs each other channel
PET_WALK_STEPS = 10         # new steps within the 30 s
PET_MUSIC_DB = 60           # dB SPL ...
PET_MUSIC_S = 5             # ... for this many seconds within the 30 s

# --- Display (UI) ---
DC_PIN = 25
RST_PIN = 24
SPI_BAUD = 24000000

# --- Touch (UI). Calibrate with: python src/ui/display.py ---
TOUCH_X_MIN = 200           # raw reading at the left edge (min > max flips the axis)
TOUCH_X_MAX = 3900          # raw reading at the right edge
TOUCH_Y_MIN = 200           # raw reading at the top edge
TOUCH_Y_MAX = 3900          # raw reading at the bottom edge
TOUCH_SWAP_XY = 0           # 1 if moving left-right changes raw y instead of x
TOUCH_PRESSURE_MIN = 100    # raw pressure that counts as a touch
